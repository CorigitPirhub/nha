[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-macro-rescue"
version = "0.1.0"
description = "RS + Macro Rescue trajectory-planning mainline"
requires-python = ">=3.11"

[project.scripts]
rs-macro-rescue-evaluate = "rs_macro_rescue.cli.evaluate_external:main"

[tool.setuptools.packages.find]
where = ["src"]
